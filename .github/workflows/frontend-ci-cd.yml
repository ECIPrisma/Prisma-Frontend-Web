name: Frontend CI/CD (Vercel Edge & AWS Failover)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-tests:
    name: Pruebas Automatizadas (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Code Quality & Lint
        run: npx oxlint || true

      - name: Run Test Suite
        run: npm test

  build-and-verify:
    name: Compilar y Verificar Vercel Edge
    needs: run-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Verify Live Vercel Deployment
        run: |
          echo "Verificando disponibilidad de la aplicación en Vercel Edge CDN..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://prisma-frontend-web.vercel.app || echo "000")
          echo "HTTP Status recibido de Vercel: $STATUS"

  deploy-to-aws:
    name: Despliegue Continuo a AWS EC2 (Nginx Web)
    needs: build-and-verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Comprobar si AWS EC2 está encendido
        id: ping-ec2
        run: |
          HOST="eciprisma.duckdns.org"
          echo "Comprobando disponibilidad de AWS EC2 en $HOST:22..."
          if nc -z -w 5 "$HOST" 22; then
            echo "ec2_online=true" >> $GITHUB_OUTPUT
            echo "AWS EC2 está encendido y accesible."
          else
            echo "ec2_online=false" >> $GITHUB_OUTPUT
            echo "AWS EC2 no respondió en el puerto 22."
          fi

      - name: Setup Node.js 22
        if: steps.ping-ec2.outputs.ec2_online == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies & Build
        if: steps.ping-ec2.outputs.ec2_online == 'true'
        run: |
          npm install
          npm run build

      - name: Copy Dist to AWS EC2 via SCP
        if: steps.ping-ec2.outputs.ec2_online == 'true' && env.SSH_KEY != ''
        uses: appleboy/scp-action@v0.1.7
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        with:
          host: "eciprisma.duckdns.org"
          username: ${{ secrets.EC2_USER || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/*"
          target: "/home/ec2-user/web_dist"
          strip_components: 1

      - name: Update Nginx Static Files on AWS EC2
        if: steps.ping-ec2.outputs.ec2_online == 'true' && env.SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        with:
          host: "eciprisma.duckdns.org"
          username: ${{ secrets.EC2_USER || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo cp -r /home/ec2-user/web_dist/* /var/www/prisma-web/
            sudo chown -R nginx:nginx /var/www/prisma-web
            sudo chmod -R 755 /var/www/prisma-web
            sudo systemctl reload nginx
            rm -rf /home/ec2-user/web_dist
            curl -s -I https://eciprisma.duckdns.org/
